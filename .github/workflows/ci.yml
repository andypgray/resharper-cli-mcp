name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Dependabot regenerates packages.lock.json only for the project whose PackageReference it
      # edited. The test project reaches src's packages through a ProjectReference, so a bump in
      # src/ leaves the test project's lock file stale and the locked restore stops the run with
      # NU1004 before a single test compiles. Re-evaluating on Dependabot's own PRs makes the run
      # answer the question the PR asks — does the new version work — instead of always reporting
      # the same lock-file staleness. Every other event keeps the strict locked restore.
      # Matched on the PR author, not github.actor, which changes as soon as a human pushes to the
      # branch; on a push event the expression is empty.
      - name: Restore
        run: >
          dotnet restore tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj
          ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '--force-evaluate' || '' }}

      - name: Build
        run: dotnet build tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj --no-restore

      - name: Test
        # Exclude the ExternalLinks network liveness test; it runs only on the weekly linkcheck.yml
        # schedule. Keeps the every-PR suite fully offline, deterministic, and fast.
        run: dotnet test tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj --no-build --filter "Category!=ExternalLinks" --logger "console;verbosity=normal"

  # Packs on Linux and asserts the MCP manifest lands at exactly `.mcp/server.json` — the
  # path nuget.org scans to generate the VS Code MCP config. A backslash PackagePath
  # mis-packs only on non-Windows (1.0.0 shipped `.mcp//server.json`), so a single
  # ubuntu job — not the 3-OS matrix — is the leg that catches it.
  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/Zphil.ReSharperCli/Zphil.ReSharperCli.csproj -c Release -o artifacts

      - name: Verify server.json is packed at .mcp/server.json
        run: |
          entries="$(unzip -Z1 artifacts/*.nupkg)"
          grep -Fxq '.mcp/server.json' <<<"$entries" || {
            echo "::error::MCP manifest missing or mis-pathed in the packed nupkg (need .mcp/server.json)"
            printf '%s\n' "$entries" | grep -i 'server\.json' || true
            exit 1
          }
