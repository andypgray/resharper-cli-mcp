name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # global.json pins the 10.0 SDK band, which an SDK 11 preinstalled on the image does not satisfy.
      # The Base Path line of `dotnet --info` names the SDK this job resolved.
      - name: Show the .NET SDK
        run: dotnet --info

      # Dependabot regenerates packages.lock.json only for the project whose PackageReference it
      # edited. The test project reaches src's packages through a ProjectReference, so a bump in
      # src/ leaves the test project's lock file stale and the locked restore stops the run with
      # NU1004 before a single test compiles. Re-evaluating on Dependabot's own PRs makes the run
      # answer the question the PR asks — does the new version work — instead of always reporting
      # the same lock-file staleness. Every other event keeps the strict locked restore.
      # Matched on the PR author, not github.actor, which changes as soon as a human pushes to the
      # branch; on a push event the expression is empty.
      - name: Restore
        run: >
          dotnet restore tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj
          ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '--force-evaluate' || '' }}

      - name: Build
        run: dotnet build tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj --no-restore

      - name: Test
        # Exclude the two scheduled suites: ExternalLinks checks third-party documentation links over the
        # network (linkcheck.yml, weekly), and JbContract installs a real jb and analyses a fixture solution
        # with it (jb-contract.yml, daily). Both need something outside the checkout; leaving them out keeps
        # the every-PR suite fully offline, deterministic, and fast.
        #
        # `--output Detailed` is Microsoft.Testing.Platform's spelling of the per-test line VSTest got from
        # `--logger "console;verbosity=normal"`. The old flag is not ignored under MTP, it is rejected:
        # `dotnet test` stops with exit code 5 before discovering a single test.
        run: dotnet test tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj --no-build --filter "Category!=ExternalLinks&Category!=JbContract" --output Detailed

  # The package targets net10.0 with RollForward=Major, so a machine with only the .NET 11 runtime runs
  # it on .NET 11. This job reproduces that: it builds with the pinned 10.0 SDK, then runs the every-PR
  # suite under DOTNET_ROLL_FORWARD=LatestMajor, which every process the suite spawns inherits as well.
  # One Ubuntu leg covers it, because the code that differs per platform is the same on either runtime.
  test-on-latest-runtime:
    runs-on: ubuntu-latest

    env:
      TEST_APP: tests/Zphil.ReSharperCli.Tests/bin/Debug/net10.0/Zphil.ReSharperCli.Tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Show the .NET SDK
        run: dotnet --info

      # Re-evaluates on Dependabot's own PRs for the reason build-and-test's Restore step gives.
      - name: Restore
        run: >
          dotnet restore tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj
          ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '--force-evaluate' || '' }}

      - name: Build
        run: dotnet build tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj --no-restore

      # Run directly, the test app is xUnit's in-process runner, whose banner names the runtime it got.
      # A roll-forward that did not happen would otherwise pass the whole suite on .NET 10.
      - name: Check the tests run on .NET 11
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          listing="$("$TEST_APP" -list classes)"
          banner="${listing%%$'\n'*}"
          printf '%s\n' "$banner"
          grep -Eq '64-bit \.NET 11\.' <<<"$banner" || {
            echo "::error::The test app did not start on the .NET 11 runtime"
            exit 1
          }

      # Prints, never fails: the app-local assemblies the host replaces with the higher-versioned copy
      # that the .NET 11 shared framework carries, such as the Microsoft.Extensions abstractions.
      - name: Show which app assemblies the shared framework replaces
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
          COREHOST_TRACE: '1'
          COREHOST_TRACEFILE: ${{ runner.temp }}/host-trace.txt
        run: |
          "$TEST_APP" -list classes > /dev/null
          grep -F "Replacing deps entry" "$COREHOST_TRACEFILE" || echo "The host replaced no app-local assembly."

      - name: Test
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet test tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj --no-build --filter "Category!=ExternalLinks&Category!=JbContract" --output Detailed

  # Packs on Linux and asserts the MCP manifest lands at exactly `.mcp/server.json` — the
  # path nuget.org scans to generate the VS Code MCP config. A backslash PackagePath
  # mis-packs only on non-Windows (1.0.0 shipped `.mcp//server.json`), so a single
  # ubuntu job — not the 3-OS matrix — is the leg that catches it.
  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Show the .NET SDK
        run: dotnet --info

      - name: Pack
        run: dotnet pack src/Zphil.ReSharperCli/Zphil.ReSharperCli.csproj -c Release -o artifacts

      - name: Verify server.json is packed at .mcp/server.json
        run: |
          entries="$(unzip -Z1 artifacts/*.nupkg)"
          grep -Fxq '.mcp/server.json' <<<"$entries" || {
            echo "::error::MCP manifest missing or mis-pathed in the packed nupkg (need .mcp/server.json)"
            printf '%s\n' "$entries" | grep -i 'server\.json' || true
            exit 1
          }
