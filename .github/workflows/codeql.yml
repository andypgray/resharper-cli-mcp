# CodeQL static analysis for C#. Runs GitHub's semantic code-scanning engine and uploads results
# to the repo's Security tab. build-mode: none does buildless analysis, so it does not depend on
# CodeQL supporting the net10.0 build. Also satisfies OpenSSF Scorecard's SAST check, which credits
# the presence of a github/codeql-action/analyze step.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'  # Mondays 03:30 UTC (offset from the Scorecard workflow's 02:30)

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload CodeQL findings to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # init and analyze must be pinned to the SAME version: analyze reads the config file init
      # wrote and aborts on a version mismatch ("Loaded a configuration file for version X, but
      # running version Y"). Bump them together — the dependabot group in .github/dependabot.yml
      # exists so an update cannot arrive as two separate PRs that each move only one of them.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: '/language:csharp'
