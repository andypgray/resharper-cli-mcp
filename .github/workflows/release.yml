# Publishes Zphil.ReSharperCli to NuGet and creates a GitHub release when a v* tag is pushed.
#
# Auth: NuGet trusted publishing (OIDC). The job trades a GitHub-signed OIDC token for
# a short-lived (1-hour, single-use) nuget.org API key at run time via the NuGet/login
# step — there is NO long-lived NUGET_API_KEY secret to store or rotate. This requires a
# trusted-publishing policy on nuget.org (owner + repo + this workflow's file name) and
# the `id-token: write` permission below.
#
# Why pack in CI rather than locally: packing here means SourceLink embeds a commit
# that actually exists on GitHub, so debugger source-stepping resolves. The symbol
# package (.snupkg) is produced alongside the .nupkg and `dotnet nuget push` uploads
# it automatically. ContinuousIntegrationBuild engages via the csproj's `$(CI)`
# condition (GitHub Actions sets CI=true), which normalizes embedded paths.
#
# Build/test scope: the test project is built and tested, which compiles src/
# transitively via its ProjectReference — that is the whole solution here. The pack
# step then rebuilds and packs src/ on its own so ContinuousIntegrationBuild applies.
#
# Provenance: after packing, actions/attest emits signed SLSA build provenance for the
# .nupkg/.snupkg and the .mcpb bundle, and the Sigstore bundle ships as a release asset
# (offline verification, plus Scorecard's Signed-Releases check). Permissions moved from
# the workflow level down to the release job (top level is now contents: read) so the
# attestations: write and id-token: write grants stay scoped to the single job that needs
# them.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # OIDC: NuGet trusted publishing + Sigstore signing for attestations
      attestations: write  # persist the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The tag drives publication, so it must agree with every place the version is
      # declared: the csproj <Version>, BOTH version fields in .mcp/server.json (the
      # top-level `version` and the package entry's `version`), BOTH in
      # .claude-plugin/plugin.json (its `version`, and the version its dnx argument
      # pins), the dnx pin in the root mcp.json the Agent Plugins hosts read, the
      # `version` in .cursor-plugin/plugin.json, BOTH in gemini-extension.json (its
      # `version`, and its own dnx pin), and the `version` in mcpb/manifest.json, which
      # travels inside the Claude Desktop bundle packed further down. Any mismatch fails
      # the release before anything is pushed. jq ships on the ubuntu-latest runner.
      # VersionSiteTests holds the same set on every PR, so a drifted site normally fails
      # there first; this is the gate that cannot be skipped.
      #
      # The two plugin fields move together or the pin never reaches anyone: Claude Code
      # ships an installed plugin updates only when the manifest `version` changes, so a
      # frozen `version` would leave every existing install on its install-time pin. The
      # root plugin.json deliberately declares no version — its launcher lives in
      # mcp.json — so there is nothing to check there and a test pins that absence.
      # .cursor-plugin/plugin.json carries no launcher and so has only the one field, but
      # it is checked because cursor.directory's importer substitutes "1.0.0" for a
      # missing version: the choice there is between a right version and a wrong one.
      # mcpb/manifest.json has no launcher either — the server it starts is packed beside
      # it — but mcpb/pack.sh names the archive from the csproj, so a drifted field ships
      # a file called one version declaring another.
      #
      # Every pin is read by enumerating .mcpServers[] rather than naming the `resharper`
      # key, so renaming that key cannot make a check vacuous, and with ltrimstr rather
      # than sub, so the `.` in the package id needs no regex escaping. An unpinned
      # launcher matches nothing and yields an empty string, which fails the same
      # assertion — this catches removal as well as drift.
      - name: Verify tag matches every version site
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          dnx_pin() {
            jq -r '.mcpServers[].args[]
              | select(startswith("Zphil.ReSharperCli@"))
              | ltrimstr("Zphil.ReSharperCli@")' "$1"
          }
          CSPROJ=$(grep -oP '(?<=<Version>)[^<]+' src/Zphil.ReSharperCli/Zphil.ReSharperCli.csproj)
          SERVER_TOP=$(jq -r '.version' .mcp/server.json)
          SERVER_PKG=$(jq -r '.packages[0].version' .mcp/server.json)
          PLUGIN_TOP=$(jq -r '.version' .claude-plugin/plugin.json)
          PLUGIN_PIN=$(dnx_pin .claude-plugin/plugin.json)
          MCP_PIN=$(dnx_pin mcp.json)
          CURSOR_TOP=$(jq -r '.version' .cursor-plugin/plugin.json)
          GEMINI_TOP=$(jq -r '.version' gemini-extension.json)
          GEMINI_PIN=$(dnx_pin gemini-extension.json)
          MCPB_TOP=$(jq -r '.version' mcpb/manifest.json)
          echo "tag=$TAG csproj=$CSPROJ server.json/.version=$SERVER_TOP server.json/.packages[0].version=$SERVER_PKG plugin.json/.version=$PLUGIN_TOP plugin.json/dnx-pin=$PLUGIN_PIN mcp.json/dnx-pin=$MCP_PIN .cursor-plugin/plugin.json/.version=$CURSOR_TOP gemini-extension.json/.version=$GEMINI_TOP gemini-extension.json/dnx-pin=$GEMINI_PIN mcpb/manifest.json/.version=$MCPB_TOP"
          rc=0
          [ "$CSPROJ" = "$TAG" ]     || { echo "::error::csproj <Version> ($CSPROJ) != tag ($TAG)"; rc=1; }
          [ "$SERVER_TOP" = "$TAG" ] || { echo "::error::server.json .version ($SERVER_TOP) != tag ($TAG)"; rc=1; }
          [ "$SERVER_PKG" = "$TAG" ] || { echo "::error::server.json .packages[0].version ($SERVER_PKG) != tag ($TAG)"; rc=1; }
          [ "$PLUGIN_TOP" = "$TAG" ] || { echo "::error::.claude-plugin/plugin.json .version ($PLUGIN_TOP) != tag ($TAG) — an unchanged version ships no update"; rc=1; }
          [ "$PLUGIN_PIN" = "$TAG" ] || { echo "::error::.claude-plugin/plugin.json dnx pin ($PLUGIN_PIN) != tag ($TAG) — empty means the launcher is unpinned"; rc=1; }
          [ "$MCP_PIN" = "$TAG" ]    || { echo "::error::mcp.json dnx pin ($MCP_PIN) != tag ($TAG) — empty means the launcher is unpinned"; rc=1; }
          [ "$CURSOR_TOP" = "$TAG" ] || { echo "::error::.cursor-plugin/plugin.json .version ($CURSOR_TOP) != tag ($TAG) — a missing one is imported as 1.0.0"; rc=1; }
          [ "$GEMINI_TOP" = "$TAG" ] || { echo "::error::gemini-extension.json .version ($GEMINI_TOP) != tag ($TAG)"; rc=1; }
          [ "$GEMINI_PIN" = "$TAG" ] || { echo "::error::gemini-extension.json dnx pin ($GEMINI_PIN) != tag ($TAG) — empty means the launcher is unpinned"; rc=1; }
          [ "$MCPB_TOP" = "$TAG" ]   || { echo "::error::mcpb/manifest.json .version ($MCPB_TOP) != tag ($TAG) — the bundle would be named one version and declare another"; rc=1; }
          exit $rc

      - name: Build (test project builds src/ transitively)
        run: dotnet build tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj -c Release

      - name: Test
        run: dotnet test tests/Zphil.ReSharperCli.Tests/Zphil.ReSharperCli.Tests.csproj -c Release --no-build

      - name: Pack (produces .nupkg + .snupkg)
        run: dotnet pack src/Zphil.ReSharperCli/Zphil.ReSharperCli.csproj -c Release -o artifacts

      # nuget.org generates the VS Code MCP config only if the package holds an entry at
      # exactly `.mcp/server.json`. 1.0.0 shipped it as `.mcp//server.json` because the csproj
      # PackagePath used a backslash and this runner is Linux — a bug Windows packs cannot
      # reproduce, so this runner is the only place the path is truly verified. Fail here,
      # before the immutable nuget push. -Z1 lists one entry per line; -Fxq is a whole-line
      # literal match, so the double-slash form fails it. Capturing into a variable first
      # avoids a SIGPIPE false-failure from a live unzip|grep pipe.
      # The icon is checked in the same pass and for the same reason: <PackageIcon> names a path
      # inside the package, and a package declaring an icon it does not carry is rejected at push
      # — after the version has already been burned. The name is read out of the nuspec rather
      # than written here twice, so renaming the render moves one site.
      - name: Verify server.json and the package icon are packed
        run: |
          entries="$(unzip -Z1 artifacts/*.nupkg)"
          grep -Fxq '.mcp/server.json' <<<"$entries" || {
            echo "::error::MCP manifest missing or mis-pathed in the packed nupkg (need .mcp/server.json)"
            printf '%s\n' "$entries" | grep -i 'server\.json' || true
            exit 1
          }
          nuspec="$(unzip -p artifacts/*.nupkg '*.nuspec')"
          icon="$(sed -n 's:.*<icon>\(.*\)</icon>.*:\1:p' <<<"$nuspec")"
          [ -n "$icon" ] || { echo "::error::nuspec declares no <icon> — the csproj <PackageIcon> is missing"; exit 1; }
          grep -Fxq "$icon" <<<"$entries" || {
            echo "::error::nuspec declares <icon>$icon</icon> but the nupkg carries no such entry"
            printf '%s\n' "$entries" | grep -i '\.png$' || true
            exit 1
          }

      # The MCP Bundle Claude Desktop installs: manifest, icon, and a framework-dependent
      # publish of the server. mcpb/pack.sh is the same script a maintainer runs locally,
      # so what ships is what was tested; it pulls the pinned mcpb CLI through npx, and
      # Node ships on the ubuntu-latest runner, so there is no setup-node step to add.
      # Packing here is also where the Unix execute bit would be correct by construction:
      # `mcpb pack` copies permission bits into the zip only when it runs on Unix. Nothing
      # in this bundle needs one — the entry point is a .dll launched through `dotnet` —
      # but a bundle that ever gains a real binary entry point inherits that for free.
      - name: Pack the Claude Desktop bundle (.mcpb)
        run: bash mcpb/pack.sh

      # Signed SLSA build provenance for the exact bytes built here (actions/attest emits
      # provenance by default when no predicate is given). Verify with:
      #   gh attestation verify <file> --repo andypgray/resharper-cli-mcp
      # The .mcpb is a subject too: it is a release asset a user downloads and double-clicks,
      # which is the same threat the .nupkg's provenance answers.
      # Permissions: id-token + attestations only. Do NOT add artifact-metadata: write —
      # that is for create-storage-record/push-to-registry, which file subjects don't use.
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/*.mcpb

      # Ship the Sigstore bundle as a release asset: enables offline verification
      # (gh attestation verify --bundle) and is what Scorecard's Signed-Releases
      # check looks for (it scans release assets for *.intoto.jsonl, not the API).
      - name: Stage attestation bundle for the release
        run: cp "${{ steps.attest.outputs.bundle-path }}" artifacts/attestation.intoto.jsonl

      # Requested right before the push (not earlier) so the 1-hour, single-use key can't
      # expire behind the slow build/test steps. `user` is the nuget.org profile name
      # (not an email); the OIDC token is minted by the id-token: write permission above.
      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: andypgray

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg artifacts/*.mcpb artifacts/attestation.intoto.jsonl --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
